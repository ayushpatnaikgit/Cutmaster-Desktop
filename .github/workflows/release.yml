# Builds the Elyps image for Intel/AMD (amd64) and Apple Silicon/ARM
# (arm64) on native runners, smoke-tests each, and publishes one multi-arch
# image to GitHub Container Registry.
#
#   Release:  git tag v1.0.0 && git push --tags   → :1.0.0, :1.0, :latest
#   Preview:  push to main                         → :edge
name: Release image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/elyps

jobs:
  build:
    strategy:
      fail-fast: false        # one architecture failing shouldn't cancel the other
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # The image is ~3.7 GB; the runner's free disk isn't enough to build,
      # cache and load it. Remove preinstalled toolchains we don't use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup /usr/share/swift || true
          docker system prune -af >/dev/null || true
          df -h /

      - uses: actions/checkout@v4

      - name: Lower-case image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"

      - name: Version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else echo "version=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@v3

      - name: Build (loaded locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          load: true
          tags: elyps-test
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Smoke test — every tool the agent needs is present
        run: |
          echo "::notice::images: $(docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | tr '\n' ' ')"
          if ! out=$(docker run -d --name smoke --shm-size 2g -p 4322:4322 elyps-test 2>&1); then
            echo "::error::docker run failed: $(echo "$out" | tr '\n' ' ' | cut -c1-900)"
            echo "::error::disk: $(df -h / | tail -1)"
            exit 1
          fi
          sleep 3
          if [ "$(docker inspect -f "{{.State.Running}}" smoke)" != true ]; then
            echo "::error::container exited: $(docker logs smoke 2>&1 | tail -20 | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
          ok=
          for i in $(seq 1 60); do curl -fs localhost:4322/api/version && ok=1 && break; sleep 2; done
          [ -n "$ok" ] || { echo "::error::app didn't come up: $(docker logs smoke 2>&1 | tail -20 | tr '\n' ' ' | cut -c1-900)"; exit 1; }
          curl -fs "localhost:4322/api/doctor?fresh=1" | tee doctor.json
          # everything except the (deliberately absent) API key must pass
          python3 -c "import json,sys; d=json.load(open('doctor.json')); bad=[c for c in d['checks'] if c['status']=='fail' and c['id']!='key']; print(bad); sys.exit(1 if bad else 0)" || { echo "::error::system check failed: $(cat doctor.json | cut -c1-900)"; exit 1; }
          docker rm -f smoke
          # free the loaded copy before the push step rebuilds from cache
          docker image rm elyps-test >/dev/null

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          d="${{ steps.push.outputs.digest }}"; touch "/tmp/digests/${d#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Lower-case image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Create the multi-arch image
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
      # Elyps was called Cutmaster: keep the old image name updated for a while
      # so existing installs still get new versions with `cutmaster update`.
      - name: Also publish under the old name
        run: |
          OLD="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cutmaster-desktop"
          V="${{ steps.meta.outputs.version }}"
          docker buildx imagetools create -t "$OLD:$V" $([[ "$GITHUB_REF" == refs/tags/v* ]] && echo "-t $OLD:latest") "$IMAGE:$V"
